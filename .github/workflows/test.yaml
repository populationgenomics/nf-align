name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      # the stub-run tests skip without nextflow on PATH, so CI must provide it
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: nf-core/setup-nextflow@v2
        with:
          version: '26.10.3'
      - run: uv run pytest -rs
      - run: nextflow lint
